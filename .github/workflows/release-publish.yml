---
name: "Release Publish"

on:
  release:
    types:
      - published
  workflow_dispatch:

permissions: {}

jobs:
  npm-publish:
    name: "Publish"
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: "Setup Node"
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "lts/*"

      - name: "Checkout"
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: "Install dependencies"
        run: npm install

      - name: "Checkout Node-RED"
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: node-red/node-red
          path: node-red

      - name: "Build"
        run: npm run build

      - name: "Publish to npm"
        run: npm publish
