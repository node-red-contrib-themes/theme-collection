---
name: "Release Publish"

on:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  npm-publish:
    name: "Publish"
    runs-on: ubuntu-latest
    steps:
      - name: "Setup Node"
        uses: actions/setup-node@v6.2.0
        with:
          node-version: "lts/*"

      - name: "Checkout"
        uses: actions/checkout@v6.0.1

      - name: "Install dependencies"
        run: npm install

      - name: "Checkout Node-RED"
        uses: actions/checkout@v6.0.1
        with:
          repository: node-red/node-red
          path: node-red

      - name: "Build"
        run: npm run build

      - name: "Publish to npm"
        run: npm publish
