---
name: "Release Drafter"

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions: {}

jobs:
  update_release_draft:
    name: "Update Release Draft"
    permissions:
      pull-requests: read
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: release-drafter/release-drafter@c345907820e0396f6f44bcfd9ac4763325f8feb0 # v7.8.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
