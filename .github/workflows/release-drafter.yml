---
name: "Release Drafter"

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions: {}

jobs:
  update_release_draft:
    name: "Update Release Draft"
    permissions:
      pull-requests: read
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: release-drafter/release-drafter@73b95fa1c286dfd6802a4f949b07dad6149f2b0f # v7.5.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
