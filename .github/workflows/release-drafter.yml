---
name: "Release Drafter"

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions: {}

jobs:
  update_release_draft:
    name: "Update Release Draft"
    permissions:
      pull-requests: read
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: release-drafter/release-drafter@72967cdc98ddd3160f1fc3dff619de365e137dd0 # v7.9.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
