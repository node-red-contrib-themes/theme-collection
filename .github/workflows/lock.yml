---
name: "Lock Threads"

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  lock:
    name: "Lock closed issues and PRs"
    permissions:
      issues: write
      pull-requests: write
      discussions: write
    runs-on: ubuntu-latest
    steps:
      - uses: dessant/lock-threads@89ae32b08ed1a541efecbab17912962a5e38981c # v6.0.2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          issue-inactive-days: "30"
          issue-lock-reason: ""
          pr-inactive-days: "1"
          pr-lock-reason: ""
